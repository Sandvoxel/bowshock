[workspace]
members = ["bowshock", "bowshock-cfd", "bowshock-reference", "bowshock-cases", "bowshock-gpu-cases", "bowshock-validate"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sandvoxel/bowshock"

[workspace.dependencies]
bowshock = { path = "bowshock", version = "0.1.0", default-features = false }
bowshock-cfd = { path = "bowshock-cfd", version = "0.1.0", default-features = false }
bowshock-reference = { path = "bowshock-reference", version = "0.1.0" }
bowshock-cases = { path = "bowshock-cases" }
bowshock-gpu-cases = { path = "bowshock-gpu-cases" }
luma = { git = "https://github.com/flipnoteman/Luma.git", rev = "c2d0301d5126050b3abc82d8db7ab655adfa65e7" }
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
gif = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
