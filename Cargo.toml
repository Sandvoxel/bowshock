[workspace]
members = ["crates/*"]
# The patched iced crates are path dependencies of the app, not members: keep them out of `--workspace` builds and lints.
exclude = ["vendor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sandvoxel/bowshock"

[workspace.dependencies]
bowshock-core = { path = "crates/bowshock-core", version = "0.1.0", default-features = false }
bowshock-cfd = { path = "crates/bowshock-cfd", version = "0.1.0", default-features = false }
bowshock-reference = { path = "crates/bowshock-reference", version = "0.1.0" }
bowshock-cases = { path = "crates/bowshock-cases" }
bowshock-gpu-cases = { path = "crates/bowshock-gpu-cases" }
luma = { git = "https://github.com/flipnoteman/Luma.git", rev = "7fafed6ebb58adfe5415c3d81b3143e35b263660" }
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
gif = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

# The CFD solver behind Analyze's `CFD table` is host-loop heavy (grid, iteration control, GPU graph building): an unoptimised
# build of it solves about four times slower than release, and a table is minutes of solving.
[profile.dev.package.bowshock-core]
opt-level = 3
[profile.dev.package.bowshock-cfd]
opt-level = 3
[profile.dev.package.bowshock-reference]
opt-level = 3
[profile.dev.package.luma]
opt-level = 3
# The GPU stack under Luma: command encoding and shader translation run on the host for every iteration.
[profile.dev.package.wgpu]
opt-level = 3
[profile.dev.package.wgpu-core]
opt-level = 3
[profile.dev.package.wgpu-hal]
opt-level = 3
[profile.dev.package.wgpu-types]
opt-level = 3
[profile.dev.package.naga]
opt-level = 3

# Trackpad pinch: iced (this rev) drops winit's `PinchGesture`. These two vendored copies add `mouse::Event::PinchGesture` and
# forward it; nothing else differs from upstream. See vendor/README.md.
[patch."https://github.com/iced-rs/iced.git"]
iced_core = { path = "vendor/iced_core" }
iced_winit = { path = "vendor/iced_winit" }

# The worker that `bowshock-remote` builds on the remote machine on first use: the first build should take minutes, not tens of
# minutes; the solves are GPU-bound and do not notice.
[profile.worker]
inherits = "release"
lto = false
codegen-units = 16
