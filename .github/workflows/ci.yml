name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --release -p bowshock-cfd -p bowshock-reference -p bowshock-cases -p bowshock
      - run: cargo test --release -p bowshock --features serde --test serde_roundtrip
      - run: cargo test --release -p bowshock-cases -- --ignored subsonic_smoke_with_base
