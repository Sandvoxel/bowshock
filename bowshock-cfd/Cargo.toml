[package]
name = "bowshock-cfd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CPU reference 2D axisymmetric Euler solver (HLLC + MUSCL + SSP-RK2) used to validate Luma GPU kernels"

[lib]
name = "bowshock_cfd"
path = "src/lib.rs"

[[bin]]
name = "cone"
path = "src/bin/cone.rs"

[[bin]]
name = "ogive"
path = "src/bin/ogive.rs"

[dependencies]
rayon = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
gif = "0.13"
