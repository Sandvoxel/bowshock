[package]
name = "bowshock-validate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Validation drivers of bowshock: CPU and GPU cone, ogive, transonic and subsonic sweeps"

[[bin]]
name = "cone"
path = "src/bin/cone.rs"

[[bin]]
name = "ogive"
path = "src/bin/ogive.rs"

[[bin]]
name = "transonic"
path = "src/bin/transonic.rs"

[[bin]]
name = "subsonic"
path = "src/bin/subsonic.rs"

[[bin]]
name = "cone_gpu"
path = "src/bin/cone_gpu.rs"

[[bin]]
name = "ogive_gpu"
path = "src/bin/ogive_gpu.rs"

[[bin]]
name = "transonic_gpu"
path = "src/bin/transonic_gpu.rs"

[[bin]]
name = "subsonic_gpu"
path = "src/bin/subsonic_gpu.rs"

[dependencies]
bowshock-core = { workspace = true, features = ["gpu", "serde"] }
bowshock-cfd = { workspace = true, features = ["gpu"] }
bowshock-reference.workspace = true
bowshock-cases.workspace = true
bowshock-gpu-cases.workspace = true
luma.workspace = true
rayon.workspace = true
# `field3_dump` writes a `Field3` as deflated CBOR, the container of the app's fixtures.
ciborium = "0.2"
flate2 = "1"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
