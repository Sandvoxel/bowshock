[package]
name = "bowshock-model"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Rocket document model for the Bowshock builder (SI units): geometry, materials, mass, configurations, stages, JSON"

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a saved document must load back bit-for-bit.
serde_json = { version = "1", features = ["float_roundtrip"] }
# OpenRocket .ork import: an .ork is XML, usually inside a ZIP (deflate) entry.
roxmltree = "0.21"
flate2 = "1"

[lints]
workspace = true
