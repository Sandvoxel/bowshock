[package]
name = "bowshock-model"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Rocket document model for the Bowshock builder (SI units): geometry, materials, mass, configurations, stages, the .bowshock file format"

[dependencies]
serde = { version = "1", features = ["derive"] }
# The .bowshock document is CBOR (self-describing, so serde's skip/default/tagged-enum attributes work), then deflated.
ciborium = "0.2"
# OpenRocket .ork import: an .ork is XML, usually inside a ZIP (deflate) entry. Also the .bowshock compression.
roxmltree = "0.21"
flate2 = "1"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
