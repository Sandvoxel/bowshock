[package]
name = "bowshock"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Bowshock desktop app: the rocket builder UI (iced)"

[[bin]]
name = "bowshock"
path = "src/main.rs"

[dependencies]
# iced master (0.15-dev) is on wgpu 30, the same major as Luma; 0.14 is on wgpu 27. Pinned like Luma.
iced = { git = "https://github.com/iced-rs/iced.git", rev = "b2fbd3cb6289603f8cbbb2387a5242231f509d13", features = ["canvas", "advanced", "svg"] }
# Headless driver for `bowshock drive` (scripted interaction + screenshots); same rev as iced.
iced_test = { git = "https://github.com/iced-rs/iced.git", rev = "b2fbd3cb6289603f8cbbb2387a5242231f509d13" }
png = "0.18"
# Fin outlines are traced from a PNG or JPEG photo or drawing (`build::fin_trace`).
image = { workspace = true, features = ["png", "jpeg"] }
glam = { version = "0.33", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
bowshock-model = { path = "../bowshock-model" }
bowshock-sim = { path = "../bowshock-sim" }
# The motor picker searches and downloads from ThrustCurve.org.
bowshock-motors = { path = "../bowshock-motors", features = ["thrustcurve"] }
# The CFD solver behind the Analyze screen's `CFD table` method (GPU through Luma, CPU fallback).
bowshock-core = { workspace = true, features = ["gpu", "serde"] }
# Remote compute: the CFD solves run on another computer's GPU over SSH (`Compute::Remote`).
bowshock-remote = { path = "../bowshock-remote" }
# Flow fixtures (`bowshock_core::Field3`, written by the `field3_dump` example) are CBOR, raw-deflated.
ciborium = "0.2"
flate2 = "1"
rfd = "0.18"
# Parts-bin presets are JSON files.
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a preset saved and read back must be bit-identical.
serde_json = { version = "1", features = ["float_roundtrip"] }
# The Simulate wind forecast is fetched from Open-Meteo (same major as bowshock-motors' client).
ureq = "3"
# Local wall-clock time: the forecast's default launch hour.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Rasterises the application icon (the same version iced's software renderer uses).
tiny-skia = "0.12"

# The Dock icon of an un-bundled macOS run (`platform::set_dock_icon`); the versions winit already pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }

[lints]
workspace = true
