[package]
name = "bowshock-lazy"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Experiment: bowshock's explicit solver (MUSCL + HLLC/Rusanov + SSP-RK3) written in plain Luma array ops"
publish = false

# Standalone: not a member of the bowshock workspace (it uses the unreleased lazy Luma API from a local checkout).
[workspace]

[dependencies]
bowshock-core = { path = "../bowshock-core" }
luma = { path = "/home/sandvoxel/Documents/luma" }

[dev-dependencies]
# Reference implementations the lazy solver is compared with (CPU f64 `Solver`, hand-written WGSL `GpuSolver`) and the
# test / benchmark set-ups (`ConeCase`, `transonic_case`, Taylor-Maccoll shock angle).
bowshock = { path = "../bowshock", default-features = false }
bowshock-cases = { path = "../bowshock-cases" }
bowshock-reference = { path = "../bowshock-reference" }
bowshock-gpu = { path = "../bowshock-gpu" }
# The Luma that `bowshock-gpu` is built on (same git revision as the bowshock workspace pin): the benchmark needs its `Context`
# to construct the hand-written-kernel `GpuSolver`.
luma_old = { package = "luma", git = "https://github.com/flipnoteman/Luma.git", rev = "ff1ff99dce9b85c4fe76d99e98a9a8c95b4ae46f" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
