[book]
title = "The bowshock Guide"
authors = ["Sandvoxel"]
description = "User guide for bowshock, zero-lift drag of axisymmetric rockets in Rust, on the GPU"
language = "en"
src = "src"

[build]
create-missing = false

[output.html]
git-repository-url = "https://github.com/Sandvoxel/bowshock"
edit-url-template = "https://github.com/Sandvoxel/bowshock/edit/main/guide/{path}"
default-theme = "light"
preferred-dark-theme = "navy"
additional-js = ["theme/versions.js"]
additional-css = ["theme/versions.css"]

[output.html.playground]
runnable = false
